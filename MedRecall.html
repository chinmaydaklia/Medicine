<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2545">
<title>MedRecall – Medicine &amp; MR Manager</title>
<style>
:root{--navy:#0b2545;--navy2:#13315c;--blue:#1d4e89;--accent:#2a6fdb;--bg:#f3f6fb;--card:#fff;--line:#d9e2ef;--text:#14213d;--muted:#5b6b82;--ok:#1f7a4d;--okbg:#e3f4ea;--warn:#8a5200;--warnbg:#fff3d6;--bad:#b42318;--badbg:#fde8e7;--demo:#4b2fa3;--demobg:#ece6ff;--r:10px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--blue)}
h1{font-size:22px;margin:0 0 12px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:14px 0 8px}
.muted{color:var(--muted)}
small{font-size:13px}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--navy);color:#fff;height:58px}
.brand{color:#fff;font-weight:700;font-size:19px;text-decoration:none;white-space:nowrap}
.brand span{font-weight:400;opacity:.75;font-size:14px}
.gsearch{flex:1;min-width:0;max-width:640px}
.gsearch input{width:100%;padding:10px 12px;border-radius:8px;border:0;font-size:16px;background:#fff;color:var(--text)}
.icon-btn{background:transparent;border:0;color:inherit;font-size:22px;min-width:44px;min-height:44px;cursor:pointer;border-radius:8px}
.layout{display:flex;min-height:calc(100vh - 58px)}
nav#nav{width:236px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
nav#nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-weight:500;margin-bottom:2px}
nav#nav a:hover{background:#eef3fa}
nav#nav a.on{background:var(--navy);color:#fff}
nav#nav .ni{width:22px;text-align:center}
nav#nav .navfoot{margin-top:14px;padding:10px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
#navShade{display:none}
main{flex:1;min-width:0;padding:18px;max-width:1240px}
@media(max-width:899px){
 nav#nav{position:fixed;left:0;top:58px;bottom:0;height:auto;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
 body.navopen nav#nav{transform:none}
 body.navopen #navShade{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.35);z-index:35}
 main{padding:12px}
 .brand span{display:none}
}
@media(min-width:900px){#menuBtn{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit;line-height:1.2}
.btn:hover{background:var(--navy2)}
.btn.sec{background:#fff;color:var(--navy)}
.btn.sec:hover{background:#eef3fa}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--navy)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--text)}
.stat b{display:block;font-size:26px;color:var(--navy)}
.stat span{font-size:13px;color:var(--muted)}
.quick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.quick .btn{min-height:56px;font-size:16px}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;position:relative}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;font-size:17px;color:var(--navy)}
.item .comp{margin:3px 0;font-weight:500}
.item .meta{font-size:14px;color:var(--muted)}
.list{display:grid;gap:8px}
.li{padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600;vertical-align:middle;white-space:nowrap}
.b-unv{background:var(--warnbg);color:var(--warn)}
.b-ver{background:var(--okbg);color:var(--ok)}
.b-demo{background:var(--demobg);color:var(--demo)}
.b-bad{background:var(--badbg);color:var(--bad)}
.b-info{background:#e5eefb;color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:#e9eff8;color:var(--navy);font-size:14px;margin:3px 4px 3px 0;cursor:pointer;border:0;font-family:inherit}
.chip:hover{background:#d9e5f5}
.chip b{font-weight:700}
.alert{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.alert.warn{background:var(--warnbg);color:#5c3700;border:1px solid #f0d08a}
.alert.bad{background:var(--badbg);color:#7a1610;border:1px solid #f3b8b3}
.alert.info{background:#e8f0fc;color:#0e2d5a;border:1px solid #bcd0f0}
.alert.ok{background:var(--okbg);color:#11482d;border:1px solid #a9dbbf}
.star{background:none;border:0;font-size:22px;cursor:pointer;color:#c3ccd9;min-width:36px;min-height:36px;padding:0}
.star.on{color:#e0a100}
.item .star{position:absolute;right:6px;top:6px}
.item .selbox{position:absolute;right:44px;top:12px;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.item .selbox input{width:20px;height:20px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
.fld.full{grid-column:1/-1}
.fld.chk{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
.fld.chk input{width:22px;height:22px}
input,select,textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid #b5c2d6;border-radius:8px;background:#fff;color:var(--text);width:100%;min-height:44px}
textarea{min-height:64px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.filters{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:10px}
.ingrow,.samprow{display:grid;grid-template-columns:2fr 1fr 44px;gap:6px;margin-bottom:6px}
.samprow{grid-template-columns:2fr 80px 1fr 44px}
@media(max-width:520px){.samprow{grid-template-columns:1fr 70px 44px}.samprow .exp{grid-column:1/3}}
.formfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:0;background:#fff;padding:10px 0 4px;border-top:1px solid var(--line)}
.msel{border:1px solid #b5c2d6;border-radius:8px;padding:6px}
.msel .msf{min-height:38px;padding:6px 8px;margin-bottom:6px}
.mslist{max-height:200px;overflow:auto}
.msi{display:flex;gap:8px;align-items:flex-start;padding:6px 4px;color:var(--text);font-weight:500;cursor:pointer;border-radius:6px}
.msi:hover{background:#f1f5fb}
.msi input{width:20px;height:20px;margin-top:2px;flex-shrink:0}
.msi small{display:block;color:var(--muted);font-weight:400}
.modal{position:fixed;inset:0;background:rgba(5,15,35,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px}
.modal.hidden{display:none}
.modal-box{background:#fff;border-radius:12px;width:100%;max-width:780px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal-box.wide{max-width:1100px}
.modal-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--navy);color:#fff;border-radius:12px 12px 0 0;z-index:2}
.modal-head h2{flex:1;margin:0;font-size:18px}
.modal-body{padding:16px}
body.modal-open{overflow:hidden}
@media(max-width:600px){.modal{padding:0}.modal-box{border-radius:0;min-height:100%}.modal-head{border-radius:0}}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
.tbl th,.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:#eef3fa;color:var(--navy);font-weight:700}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tr.same td{background:var(--okbg)}
.tbl tr.diff td{background:var(--warnbg)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs .btn{min-height:40px}
.hidecomp .comp,.hidecomp .compv{filter:blur(7px);user-select:none;cursor:pointer}
.hidecomp .revealed{filter:none!important}
.qcard{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:22px;text-align:center;margin-bottom:12px}
.qprompt{font-size:24px;font-weight:700;color:var(--navy);margin:8px 0 6px;word-break:break-word}
.qsub{color:var(--muted)}
.qans{margin-top:16px;padding:14px;background:#f1f6fd;border-radius:10px;font-size:18px;text-align:left}
.qopts{display:grid;gap:8px;margin-top:16px}
.qopt{text-align:left;padding:14px;border:1px solid #b5c2d6;border-radius:10px;background:#fff;font:inherit;font-size:16px;cursor:pointer;min-height:52px}
.qopt:hover{border-color:var(--accent)}
.qopt.right{background:var(--okbg);border-color:var(--ok)}
.qopt.wrong{background:var(--badbg);border-color:var(--bad)}
.progress{height:8px;background:#e1e8f2;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--accent)}
.timeline .li.latest{background:#f1f6fd;border-left:4px solid var(--accent);padding-left:10px;border-radius:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 24px);max-width:520px}
#toast div{background:#14213d;color:#fff;padding:11px 16px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:15px;pointer-events:auto}
#toast div.err{background:var(--bad)}
.empty{padding:20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.dl{display:flex;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.hl{background:#fff2a8;border-radius:2px}
#printArea{display:none}
@media print{
 body.printing>*:not(#printArea){display:none!important}
 body.printing #printArea{display:block}
 body:not(.printing) header.top,body:not(.printing) nav#nav,body:not(.printing) .noprint{display:none!important}
 #printArea{font-size:12px;color:#000}
 #printArea table{width:100%;border-collapse:collapse}
 #printArea th,#printArea td{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
 #printArea th{background:#e6e6e6}
 #printArea tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <button id="menuBtn" class="icon-btn" aria-label="Open menu" data-act="toggleNav">☰</button>
  <a href="#/dashboard" class="brand">MedRecall <span>Medicine &amp; MR Manager</span></a>
  <div class="gsearch"><input id="gq" type="search" placeholder="Search brand, salt, company, MR… e.g. amlo 5" autocomplete="off" aria-label="Global search"></div>
</header>
<div id="navShade" data-act="toggleNav"></div>
<div class="layout">
  <nav id="nav" aria-label="Main"></nav>
  <main id="main"></main>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box" id="modalBox">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" data-act="closeModal" aria-label="Close">✕</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="fileIn" hidden>
<script>
'use strict';
/* =========================================================
   MedRecall – Medicine & MR Manager (single-file, offline)
   Data is stored ONLY in this browser (localStorage).
   ========================================================= */
const APP_VERSION='1.0';
const KEY='medrecall_db_v1';

/* ---------- small helpers ---------- */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const nowLocal=()=>{const d=new Date();return `${dstr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const nowISO=()=>new Date().toISOString();
const addDays=(ds,n)=>{const d=new Date(ds+'T00:00');d.setDate(d.getDate()+n);return dstr(d)};
const parseD=s=>{if(!s)return null;const d=new Date(s.length<=10?s+'T00:00':s);return isNaN(d)?null:d};
const fmtDate=s=>{const d=parseD(s);return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):esc(s||'')};
const fmtDT=s=>{const d=parseD(s);if(!d)return esc(s||'');return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+(s.length>10?', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'')};
const daysBetween=(a,b)=>Math.round((parseD(b.slice(0,10))-parseD(a.slice(0,10)))/864e5);
const ago=s=>{if(!s)return '';const n=daysBetween(s,today());return n===0?'today':n===1?'yesterday':n>0?n+' days ago':'in '+(-n)+' days'};
const num=v=>{const n=parseFloat(String(v??'').replace(/[,₹\s]/g,''));return isNaN(n)?0:n};
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const nkey=s=>norm(s).replace(/[^a-z0-9.]/g,'');
const clone=o=>JSON.parse(JSON.stringify(o));
const uniq=a=>[...new Set(a)];
const byName=(a,b)=>String(a.name||a.brand||'').localeCompare(String(b.name||b.brand||''),'en',{sensitivity:'base'});
function toast(msg,err){const d=document.createElement('div');d.textContent=msg;if(err)d.className='err';$('#toast').appendChild(d);setTimeout(()=>d.remove(),err?5000:2600)}

/* ---------- reference lists ---------- */
const FORMS=['Tablet','Capsule','Injection','Syrup','Suspension','Drops','Cream','Ointment','Gel','Lotion','Inhaler','Rotacap','Respule / Nebuliser','Sachet / Powder','Spray','Patch','Suppository','Other'];
const CATEGORIES=['Antihypertensive','Antidiabetic','Lipid-lowering','Antiplatelet / Anticoagulant','Cardiac (other)','Antibiotic / Antimicrobial','Antifungal','Antiviral','Analgesic / NSAID','Gastrointestinal / Acid-peptic','Respiratory','Antihistamine / Anti-allergic','Vitamins / Supplements','Neurology','Psychiatry','Dermatology','Endocrine (other)','Urology','Gynaecology','Orthopaedic','Ophthalmic','Paediatric','Other'];
const SOURCES=['Package insert','Official product information / PI','Carton / label','Company literature / visual aid','MR (verbal)','CDSCO / official database','Other'];
const DESIGNATIONS=['Area Sales Manager (ASM)','Regional Sales Manager (RSM)','Zonal Sales Manager (ZSM)','District Manager','Product Manager','Medical Advisor','Other'];
const FREQS=['Weekly','Fortnightly','Monthly','Every 2–3 months','Irregular'];
const GIFT_CATS=['Educational material','Permitted promotional item','Hospitality','Travel support','Speaker fee','Consultancy fee','Research payment','Other'];
const GIFT_STATUS=['offered','received','declined','returned','pending'];
const REVIEW_STATUS=['Not yet reviewed','Reviewed – documentation complete','Needs clarification','Reviewed – declined / returned'];

/* ---------- database ---------- */
const COLS=['medicines','companies','mrs','managers','visits','gifts'];
function blankDB(){return {schema:1,medicines:[],companies:[],mrs:[],managers:[],visits:[],gifts:[],quiz:{},settings:{lastBackup:null,created:nowISO(),hideComp:false}}}
function normalizeDB(d){const o=Object.assign(blankDB(),d||{});COLS.forEach(c=>{if(!Array.isArray(o[c]))o[c]=[]});if(!o.quiz||typeof o.quiz!=='object')o.quiz={};o.settings=Object.assign(blankDB().settings,o.settings||{});return o}
let storageOK=true;
function loadDB(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){storageOK=false}
  if(raw){try{return normalizeDB(JSON.parse(raw))}catch(e){try{localStorage.setItem(KEY+'_corrupt_'+Date.now(),raw)}catch(_){}alert('Stored MedRecall data could not be read. A copy was kept; please restore from your latest JSON backup.')}}
  const d=blankDB();seedDemo(d);return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false;toast('⚠ Could not save to browser storage (full or blocked). Download a JSON backup now!',true)}}
const byId=(col,id)=>id?db[col].find(x=>x.id===id)||null:null;
const coName=id=>byId('companies',id)?.name||'';
const mrLabel=r=>byId('mrs',r.mrId)?.name||r.mrName||'—';
const coLabel=r=>byId('companies',r.companyId)?.name||r.companyName||'';
const medLabel=(id,i,r)=>byId('medicines',id)?.brand||(r&&r.brandNames&&r.brandNames[i])||'(deleted brand)';
const compStr=m=>(m.ingredients||[]).filter(i=>i.name).map(i=>i.name+(i.strength?' '+i.strength:'')).join(' + ');
const compOrNone=m=>compStr(m)||'Composition not recorded';
function ensureCompany(name){const n=nkey(name);let c=db.companies.find(x=>nkey(x.name)===n);if(!c){c={id:uid('co'),name:name.trim(),divisions:'',portfolio:'',hq:'',notes:'',created:nowISO(),updated:nowISO()};db.companies.push(c)}return c}
function lastVisitOf(mrId){let best=null;db.visits.forEach(v=>{if(v.mrId===mrId&&(!best||v.datetime>best.datetime))best=v});return best}
function mrLastDate(mr){const v=lastVisitOf(mr.id);const a=v?v.datetime.slice(0,10):'';const b=mr.lastVisitManual||'';return a>b?a:b}
function visitsOf(mrId){return db.visits.filter(v=>v.mrId===mrId).sort((a,b)=>b.datetime.localeCompare(a.datetime))}

/* ---------- demonstration data (fictional, unverified) ---------- */
function seedDemo(d){
  const t=today(),c1=uid('co'),c2=uid('co'),r1=uid('mr'),r2=uid('mr'),g1=uid('mgr');
  const DEMO_NOTE='DEMONSTRATION DATA – fictional brand, NOT verified medical information. Delete or replace with your own verified entries.';
  d.companies.push(
    {id:c1,name:'Demo Pharma Ltd (fictional)',divisions:'Cardio, Diabeto',portfolio:'Demonstration portfolio',hq:'',notes:'Fictional demonstration company.',demo:true,created:nowISO(),updated:nowISO()},
    {id:c2,name:'Sample Healthcare (fictional)',divisions:'Gastro',portfolio:'Demonstration portfolio',hq:'',notes:'Fictional demonstration company.',demo:true,created:nowISO(),updated:nowISO()});
  const mk=(brand,generic,ings,form,cat,co,div,mr,days)=>({id:uid('med'),brand,generic,ingredients:ings,form,strength:ings.map(i=>i.strength).join(' / '),pack:'10 tablets (demo)',category:cat,indications:'',dosage:'',companyId:co,division:div,mrId:mr,dateIntroduced:addDays(t,-days),price:'',source:'Other',sourceDetails:'Demonstration data',verified:false,starred:false,notes:DEMO_NOTE,mnemonic:'',demo:true,created:new Date(Date.now()-days*864e5).toISOString(),updated:nowISO()});
  const meds=[
    mk('DemoAmlo 5','Amlodipine',[{name:'Amlodipine',strength:'5 mg'}],'Tablet','Antihypertensive',c1,'Cardio',r1,20),
    mk('DemoTelma 40','Telmisartan',[{name:'Telmisartan',strength:'40 mg'}],'Tablet','Antihypertensive',c1,'Cardio',r1,15),
    mk('DemoTelma-AM','Telmisartan + Amlodipine',[{name:'Telmisartan',strength:'40 mg'},{name:'Amlodipine',strength:'5 mg'}],'Tablet','Antihypertensive',c1,'Cardio',r1,10),
    mk('DemoMetfo SR 500','Metformin',[{name:'Metformin',strength:'500 mg'}],'Tablet','Antidiabetic',c1,'Diabeto',r1,8),
    mk('DemoGlim-M2','Glimepiride + Metformin',[{name:'Glimepiride',strength:'2 mg'},{name:'Metformin',strength:'500 mg'}],'Tablet','Antidiabetic',c1,'Diabeto',r1,5),

/* ---------- search engine ---------- */
function phon(s){return norm(s).replace(/ph/g,'f').replace(/y/g,'i').replace(/z/g,'s').replace(/c(?=[ei])/g,'s').replace(/c/g,'k').replace(/q/g,'k').replace(/x/g,'ks').replace(/([a-z])\1+/g,'$1')}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function tokens(q){
  const out=[];
  norm(q).split(/[\s,+\/;()]+/).filter(Boolean).forEach(t=>{
    let m=t.match(/^(\d+(?:\.\d+)?)(mg|mcg|g|gm|ml|iu|%|u)$/);if(m){out.push(m[1]);return}
    m=t.match(/^([a-z]{3,})(\d+(?:\.\d+)?)$/);if(m){out.push(m[1],m[2]);return}
    out.push(t)});
  return out;
}
function matchTok(t,hay,hayPh,words){
  if(/^\d+(\.\d+)?$/.test(t))return new RegExp('(^|[^0-9.])'+t.replace('.','\\.')+'(?![0-9])').test(hay)?3:0;
  if(hay.includes(t))return words.some(w=>w.startsWith(t))?4:3;
  const tp=phon(t);if(tp.length>=3&&hayPh.includes(tp))return 2;
  if(t.length>=4){const md=t.length>=8?2:1;for(const w of words){if(w.length<t.length-1)continue;if(lev(w.slice(0,t.length),t)<=md||lev(w,t)<=md)return 1}}
  return 0;
}
function scoreText(toks,text,bonusText){
  if(!toks.length)return 1;
  const hay=norm(text),hayPh=phon(text),words=hay.split(/[^a-z0-9.]+/).filter(Boolean);
  const bh=bonusText?norm(bonusText):'';let s=0;
  for(const t of toks){const k=matchTok(t,hay,hayPh,words);if(!k)return 0;s+=k;if(bh&&bh.includes(t))s+=3}
  return s;
}
function medHay(m){return [m.brand,m.generic,compStr(m),m.form,m.strength,m.pack,m.category,m.indications,coName(m.companyId),m.division,byId('mrs',m.mrId)?.name,m.notes,m.mnemonic,m.sourceDetails].join(' | ')}
function searchMeds(q,list){const tk=tokens(q);return (list||db.medicines).map(m=>({m,s:scoreText(tk,medHay(m),m.brand+' '+(m.generic||''))})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||byName(a.m,b.m)).map(x=>x.m)}
function searchGen(q,list,hayFn){const tk=tokens(q);return list.map(r=>({r,s:scoreText(tk,hayFn(r),r.name)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||byName(a.r,b.r)).map(x=>x.r)}
const coHay=c=>[c.name,c.divisions,c.portfolio,c.hq,c.notes].join(' | ');
const mrHay=r=>[r.name,r.phone,coName(r.companyId),r.division,r.territory,r.notes,(r.brandIds||[]).map(id=>byId('medicines',id)?.brand).join(' ')].join(' | ');

function parseComposition(s){
  return String(s||'').split(/\s*(?:\+|;|\band\b|,(?!\d))\s*/i).map(p=>p.trim()).filter(Boolean).map(p=>{
    const m=p.match(/^(.*?)[\s(]*((?:\d+(?:\.\d+)?)\s*(?:mg|mcg|µg|ug|g|gm|ml|iu|i\.u\.|%|units?|lac|lakh|million|cfu|meq)(?:\s*\/\s*[\d.]*\s*(?:ml|g|gm|dose|tab|puff|actuation|sachet|5\s*ml))?\)?)\s*$/i);
    return m&&m[1]?{name:m[1].replace(/[\s(]+$/,'').trim(),strength:m[2].replace(/\)$/,'').trim()}:{name:p,strength:''};
  });
}
function saveMed(fd,id){

   QUIZ & FLASHCARDS
   ========================================================= */
const INTERVALS=[0,1,3,7,14,30];
const qrec=k=>db.quiz[k]||{c:0,w:0,box:0};
function quizRecord(k,ok){const q=Object.assign({c:0,w:0,box:0},db.quiz[k]);if(ok){q.c++;q.box=Math.min(q.box+1,5)}else{q.w++;q.box=0;q.lastWrong=today()}q.lastSeen=today();q.due=addDays(today(),INTERVALS[q.box]);db.quiz[k]=q;save()}
const quizzable=()=>db.medicines.filter(m=>(m.ingredients||[]).some(i=>i.name));
function priority(m){const q=qrec('med:'+m.id);let p=1+q.w*2-q.c*0.5;if(!q.lastSeen)p+=1.5;if(q.due&&q.due<=today())p+=2;if(q.lastWrong&&daysBetween(q.lastWrong,today())<=7)p+=2;if((m.ingredients||[]).length>1)p+=0.7;if(m.starred)p+=0.5;return Math.max(p,0.2)}
function dailyList(){return quizzable().filter(m=>{const q=qrec('med:'+m.id);return !q.due||q.due<=today()||q.lastSeen===today()}).sort((a,b)=>priority(b)-priority(a)).slice(0,10)}
function forgottenList(){return quizzable().filter(m=>{const q=qrec('med:'+m.id);return q.lastWrong&&daysBetween(q.lastWrong,today())<=30&&q.box<3}).sort((a,b)=>qrec('med:'+b.id).lastWrong.localeCompare(qrec('med:'+a.id).lastWrong))}
function weightedPick(arr,n,wfn){const pool=arr.map(x=>({x,w:wfn(x)}));const out=[];while(out.length<n&&pool.length){const tot=pool.reduce((s,p)=>s+p.w,0);let r=Math.random()*tot,i=0;for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break}out.push(pool.splice(i,1)[0].x)}return out}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function scopeMeds(scope,val){
  let l=quizzable();
  if(scope==='starred')l=l.filter(m=>m.starred);else if(scope==='daily'){const d=dailyList();l=d.filter(m=>qrec('med:'+m.id).lastSeen!==today());if(!l.length)l=d}else if(scope==='forgotten')l=forgottenList();
  else if(scope==='wrong')l=l.filter(m=>qrec('med:'+m.id).w>0);
  else if(scope==='company')l=l.filter(m=>m.companyId===val);else if(scope==='category')l=l.filter(m=>m.category===val);
  else if(scope==='ingredient')l=l.filter(m=>(m.ingredients||[]).some(i=>nkey(i.name)===val));else if(scope==='combo')l=l.filter(m=>(m.ingredients||[]).filter(i=>i.name).length>1);
  return l;
}
function buildQuiz(cfg){
  const n=cfg.n;let items=[];
  if(cfg.dir==='b2c'||cfg.dir==='c2b'){
    const pool=scopeMeds(cfg.scope,cfg.val);
    const picked=cfg.scope==='daily'?pool.slice(0,n):weightedPick(pool,n,priority);
    items=picked.map(m=>{
      const comp=compStr(m);const sameBrands=db.medicines.filter(x=>compKey(x)===compKey(m));
      const shared=x=>(x.ingredients||[]).some(i=>(m.ingredients||[]).some(j=>nkey(j.name)===nkey(i.name)));
      if(cfg.dir==='b2c'){
        const others=uniq(quizzable().filter(x=>compKey(x)!==compKey(m)).sort((a,b)=>shared(b)-shared(a)||Math.random()-.5).map(compStr)).slice(0,3);
        return {key:'med:'+m.id,medId:m.id,prompt:esc(m.brand),sub:esc([m.form,coName(m.companyId)].filter(Boolean).join(' · '))+(m.verified?'':' · <span class="badge b-unv">unverified entry</span>'),q:'What is the composition?',
          answer:`<b>${esc(comp)}</b>${m.generic?`<div class="muted">${esc(m.generic)}</div>`:''}${m.mnemonic?`<div class="meta">💡 ${esc(m.mnemonic)}</div>`:''}`,correct:comp,options:others.length?shuffle([comp,...others]):null};
      }
      const correct=m.brand;const others=uniq(quizzable().filter(x=>compKey(x)!==compKey(m)).sort((a,b)=>shared(b)-shared(a)||Math.random()-.5).map(x=>x.brand)).slice(0,3);
      return {key:'med:'+m.id,medId:m.id,prompt:esc(comp),sub:esc(m.form||'')+(sameBrands.length>1?` · ${sameBrands.length} recorded brands have this composition`:''),q:'Which brand(s)?',
        answer:`<b>${sameBrands.map(x=>esc(x.brand)+' <small class="muted">('+esc(coName(x.companyId))+')</small>').join('<br>')}</b>${m.mnemonic?`<div class="meta">💡 ${esc(m.mnemonic)}</div>`:''}`,correct,options:others.length?shuffle([correct,...others]):null};
    });
  }else if(cfg.dir==='co2b'){
    let cos=db.companies.filter(c=>db.medicines.some(m=>m.companyId===c.id));if(cfg.scope==='company')cos=cos.filter(c=>c.id===cfg.val);
    items=weightedPick(cos,n,c=>{const q=qrec('co:'+c.id);return Math.max(1+q.w*2-q.c*.5,.2)}).map(c=>({key:'co:'+c.id,prompt:esc(c.name),sub:esc(c.divisions||''),q:'Which brands have you recorded for this company?',answer:db.medicines.filter(m=>m.companyId===c.id).sort(byName).map(m=>`<b>${esc(m.brand)}</b> — ${esc(compOrNone(m))}`).join('<br>')}));
  }else{
    let mrs=db.mrs.slice();if(cfg.scope==='company')mrs=mrs.filter(r=>r.companyId===cfg.val);

function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||'';const cnt=c=>(first.match(new RegExp('\\'+c,'g'))||[]).length;
  const d=cnt('\t')>cnt(',')&&cnt('\t')>cnt(';')?'\t':cnt(';')>cnt(',')?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

function mapRows(type,rows){
  const s=CSV_SPEC[type];const hdr=rows[0].map(h=>nkey(h).replace(/\./g,''));const map={};const unmapped=[];
  hdr.forEach((h,i)=>{const f=Object.keys(s.alias).find(k=>s.alias[k].includes(h)&&!(k in map));if(f)map[f]=i;else unmapped.push(rows[0][i])});
  const recs=rows.slice(1).map(r=>{const o={};for(const k in map)o[k]=(r[map[k]]||'').trim().replace(/^'(?=[=+\-@])/,'');return o});
  return {map,unmapped,recs};
}
function findDup(type,o){
  if(o.id){const x=byId(type,o.id);if(x)return x}
  const n=nkey(o.name||o.brand);if(!n)return null;
  if(type==='medicines'){const co=o.company?db.companies.find(c=>nkey(c.name)===nkey(o.company)):null;return db.medicines.find(m=>nkey(m.brand)===n&&(!o.strength||nkey(m.strength)===nkey(o.strength))&&(!co||m.companyId===co.id))||null}
  if(type==='companies')return db.companies.find(c=>nkey(c.name)===n)||null;
  const co=o.company?db.companies.find(c=>nkey(c.name)===nkey(o.company)):null;
  return db[type].find(r=>nkey(r.name)===n&&(!co||r.companyId===co.id))||null;
}
function previewImport(type,text,fname){
  const rows=parseCSV(text);if(rows.length<2){toast('The file has no data rows',true);return}
  const {map,unmapped,recs}=mapRows(type,rows);const keyF=type==='medicines'?'brand':'name';
  if(!(keyF in map)){alert(`Could not find a “${keyF}” column. First row must contain column headers. Download the template to see the expected format.`);return}
  const valid=recs.filter(r=>r[keyF]);const dups=valid.filter(r=>findDup(type,r));
  ui.pendingImport={type,recs:valid,fname};
  const shown=Object.keys(map);
  openModal('Import '+type+' from CSV',`<p>File: <b>${esc(fname)}</b></p>
   <div class="stats"><div class="stat"><b>${recs.length}</b><span>Data rows</span></div><div class="stat"><b>${valid.length}</b><span>With ${keyF}</span></div><div class="stat"><b>${dups.length}</b><span>Possible duplicates</span></div></div>
   <p class="hint">Columns recognised: ${shown.map(esc).join(', ')}${unmapped.length?`<br>Ignored columns: ${unmapped.map(esc).join(', ')}`:''}</p>
   ${type==='medicines'?'<div class="alert warn">Imported compositions are marked <b>UNVERIFIED</b> unless the “verified” column says yes. Compositions are taken only from the file — nothing is guessed. Please check them against package inserts.</div>':''}
   <div class="tblwrap"><table class="tbl"><thead><tr>${shown.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${valid.slice(0,6).map(r=>`<tr>${shown.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <form id="mform"><h3>If a record already exists</h3>
    <label class="fld chk"><input type="radio" name="dupMode" value="skip" checked> Skip it (keep existing)</label>
    <label class="fld chk"><input type="radio" name="dupMode" value="update"> Update existing with non-empty values from the file</label>
    <label class="fld chk"><input type="radio" name="dupMode" value="add"> Add as a new record anyway</label>${formFoot('Import '+valid.length+' rows')}</form>`,fd=>doImport(fd.get('dupMode')),true);
}
function doImport(mode){
  const {type,recs,fname}=ui.pendingImport||{};if(!type)return;let added=0,updated=0,skipped=0;
  const findMr=name=>name?db.mrs.find(r=>nkey(r.name)===nkey(name)):null;
  recs.forEach(o=>{
    const dup=findDup(type,o);if(dup&&mode==='skip'){skipped++;return}
    let rec={};
    if(type==='medicines'){
      let ings=parseComposition(o.composition);if(!ings.length&&o.generic)ings=parseComposition(o.generic).map(i=>({name:i.name,strength:i.strength}));
      rec={brand:o.brand,generic:o.generic,ingredients:ings,form:o.form,strength:o.strength||ings.map(i=>i.strength).filter(Boolean).join(' / '),pack:o.pack,category:o.category,indications:o.indications,dosage:o.dosage,companyId:o.company?ensureCompany(o.company).id:undefined,division:o.division,mrId:findMr(o.mr)?.id,dateIntroduced:o.date_introduced&&parseD(o.date_introduced)?o.date_introduced:undefined,price:o.price,source:o.source,sourceDetails:o.source_details||(o.source?'':'CSV import: '+fname),verified:'verified' in o?isYes(o.verified):undefined,starred:'starred' in o?isYes(o.starred):undefined,mnemonic:o.mnemonic,notes:o.notes};
      if(!o.composition&&!o.generic)rec.ingredients=undefined;
    }else if(type==='companies')rec={name:o.name,divisions:(o.divisions||'').replace(/;/g,','),portfolio:o.portfolio,hq:o.hq,notes:o.notes};
    else if(type==='mrs'){const ids=(o.brands||'').split(/;|\|/).map(b=>db.medicines.find(m=>nkey(m.brand)===nkey(b))?.id).filter(Boolean);rec={name:o.name,phone:o.phone,companyId:o.company?ensureCompany(o.company).id:undefined,division:o.division,territory:o.territory,brandIds:ids.length?ids:undefined,firstVisit:o.first_visit&&parseD(o.first_visit)?o.first_visit:undefined,frequency:o.frequency,notes:o.notes}}
    else if(type==='managers'){const ids=(o.mrs||'').split(/;|\|/).map(n=>findMr(n)?.id).filter(Boolean);rec={name:o.name,designation:o.designation,companyId:o.company?ensureCompany(o.company).id:undefined,division:o.division,territory:o.territory,phone:o.phone,mrIds:ids.length?ids:undefined,notes:o.notes}}
    Object.keys(rec).forEach(k=>{if(rec[k]===undefined||rec[k]==='')delete rec[k]});
    if(dup&&mode==='update'){if(type==='mrs'&&rec.companyId&&dup.companyId&&rec.companyId!==dup.companyId){dup.companyHistory=dup.companyHistory||[];dup.companyHistory.push({companyId:dup.companyId,companyName:coName(dup.companyId),division:dup.division||'',from:dup.companySince||'',to:today()});rec.companySince=today()}Object.assign(dup,rec,{updated:nowISO()});updated++;return}
    const base={medicines:{ingredients:[],verified:false,starred:false},companies:{},mrs:{brandIds:[],companyHistory:[],companySince:today()},managers:{mrIds:[]}}[type];
    db[type].push(Object.assign({id:uid({medicines:'med',companies:'co',mrs:'mr',managers:'mgr'}[type]),created:nowISO(),updated:nowISO()},clone(base),rec));added++;
  });
  ui.pendingImport=null;save();refresh();alert(`Import complete: ${added} added, ${updated} updated, ${skipped} skipped.`);
}
function backupJSON(){
  const data=JSON.stringify({app:'MedRecall',version:APP_VERSION,exported:nowISO(),data:db},null,1);
  download(`MedRecall-backup-${today()}.json`,data,'application/json');db.settings.lastBackup=nowISO();save();toast('Backup downloaded — keep it somewhere safe (e.g. Google Drive or email it to yourself)');refresh();
}
function restoreJSON(text,fname){
  let obj;try{obj=JSON.parse(text)}catch(e){alert('This is not a valid JSON file.');return}
  const d=obj&&obj.data?obj.data:obj;if(!d||!COLS.some(c=>Array.isArray(d[c]))){alert('This file does not look like a MedRecall backup.');return}
  const inc=normalizeDB(d);
  openModal('Restore backup',`<p>File: <b>${esc(fname)}</b>${obj.exported?' · exported '+fmtDT(obj.exported.slice(0,16)):''}</p>
   <div class="tblwrap"><table class="tbl"><thead><tr><th></th><th class="n">In backup</th><th class="n">Currently</th></tr></thead><tbody>${COLS.map(c=>`<tr><td>${c}</td><td class="n">${inc[c].length}</td><td class="n">${db[c].length}</td></tr>`).join('')}</tbody></table></div>
   <form id="mform"><h3>How to restore</h3>
   <label class="fld chk"><input type="radio" name="m" value="merge" checked> Merge — add records missing here; for records in both, keep the most recently updated</label>
   <label class="fld chk"><input type="radio" name="m" value="replace"> Replace — erase everything here and use only the backup</label>${formFoot('Restore')}</form>`,fd=>{
    if(fd.get('m')==='replace'){if(!confirm('Replace ALL current data with the backup? Current data will be lost unless you have backed it up.'))return false;const lb=db.settings.lastBackup;db=inc;db.settings.lastBackup=db.settings.lastBackup||lb}
    else{COLS.forEach(c=>inc[c].forEach(r=>{const ex=byId(c,r.id);if(!ex)db[c].push(r);else if((r.updated||'')>(ex.updated||''))Object.assign(ex,r)}));
      Object.entries(inc.quiz).forEach(([k,q])=>{const e=db.quiz[k];if(!e||(q.lastSeen||'')>(e.lastSeen||''))db.quiz[k]=q})}
    save();toast('Backup restored');ui.medSel.clear();refresh();});
}
function pickFile(accept,cb){const f=$('#fileIn');f.accept=accept;f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>cb(String(r.result),file.name);r.onerror=()=>toast('Could not read the file',true);r.readAsText(file)};f.click()}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden')){if(!$('#mform')||confirm('Close without saving?'))closeModal()}});
$('#gq').addEventListener('input',e=>{ui.gq=e.target.value;debounce(()=>{if(ui.view!=='search'){if(ui.gq.trim())go('search')}else updSearch()},150)});
$('#gq').addEventListener('keydown',e=>{if(e.key==='Enter'){ui.gq=e.target.value;if(ui.view!=='search')go('search');else updSearch();e.target.blur()}});
window.addEventListener('hashchange',route);
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{db=normalizeDB(JSON.parse(e.newValue));refresh();toast('Data updated from another tab')}catch(_){}}});
try{if(!localStorage.getItem(KEY))save()}catch(e){storageOK=false}
route();
</script>
</body>
</html>
